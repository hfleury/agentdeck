# agentdeck's own tmux server (tmux -L agentdeck). Your ~/.tmux.conf is not read.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
# Pass Shift-Enter and other modified keys through (kitty keyboard protocol / CSI u).
set -as terminal-features ",*:extkeys"
set -g extended-keys on
set -g extended-keys-format csi-u

# Mouse: click a pane to focus it; clicks inside the sessions list go to it.
set -g mouse on
set -g focus-events on
set -g escape-time 10
set -g status off
set -g history-limit 50000
set -g set-clipboard on
set -g allow-passthrough on
set -g window-size latest
set -g set-titles on
set -g set-titles-string "agentdeck"

set -g pane-border-lines single
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour214"

# The deck's layout is fixed, so drop tmux's default bindings that swap,
# rotate, re-layout, break out or kill panes. The prefix (Ctrl-B) table is
# cleared and only harmless keys are put back.
unbind -a -T prefix
bind d detach-client
bind [ copy-mode
bind ] paste-buffer -p
bind : command-prompt
bind ? list-keys -N
bind z resize-pane -Z

# Ctrl+click swapped panes; Alt+right-click opened the pane menu.
unbind -n C-MouseDown1Pane
unbind -n M-MouseDown3Pane
# Right-click: focus the pane and pass the click to the program in it,
# instead of tmux's pane menu (Swap / Kill / Respawn).
bind -n MouseDown3Pane select-pane -t = \; if -F -t = "#{mouse_any_flag}" "send-keys -M"

# Ctrl-A, Ctrl-G, Ctrl-Space and Alt-K (command window) are bound by the
# daemon: they need pane ids and the agentdeck binary's path.
# Leave the deck (everything keeps running): Ctrl-B d, or Alt-q.
bind -n M-q detach-client
